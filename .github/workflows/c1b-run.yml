name: c1b-run

# C1-B: every child of every arm (studies/C1B/questions.md), on GitHub's machines. Nothing runs on the creator's PC.
#   1. checks:  checks_c1b.py on the committed corpus; nothing else starts unless All: PASS
#   2. arm:     one job per arm, 24 younger children each (seeds 1-24)
#   3. analyse: every child's file plus the analysis, in one artifact, c1b-results
# Run: gh workflow run c1b-run.yml -R abu4evere/cradle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - run: python studies/C1B/checks_c1b.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1b-checks
          path: studies/C1B/checks.log

  arm:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm: [A, Ym, Yo, Y, Yi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - name: 24 younger children
        run: |
          python -VV; python -c "import numpy; print('numpy', numpy.__version__)"
          for s in $(seq 1 24); do python studies/C1B/c1b.py one ${{ matrix.arm }} $s out; done
      - uses: actions/upload-artifact@v4
        with:
          name: c1b-arm-${{ matrix.arm }}
          path: out/

  analyse:
    needs: [checks, arm]
    if: always() && needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - uses: actions/download-artifact@v4
        with:
          pattern: c1b-arm-*
          merge-multiple: true
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: c1b-checks
          path: studies/C1B/
      - run: python studies/C1B/analyse_c1b.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1b-results
          path: out/
