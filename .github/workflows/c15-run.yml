name: c15-run

# C1.5: every child of every arm (studies/C1_5/questions.md, with correction 1), on GitHub's machines. Nothing runs on the creator's PC.
#   1. checks:  checks_c15.py on the committed corpora; nothing else starts unless All: PASS
#   2. arm:     one job per arm, 24 children each (seeds 1-24)
#   3. analyse: every child's file plus the analysis, in one artifact, c15-results
# Run: gh workflow run c15-run.yml -R abu4evere/cradle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - run: python studies/C1_5/checks_c15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c15-checks
          path: studies/C1_5/checks.log

  arm:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm: [B, P, K, Q, Q-]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - name: 24 children
        run: |
          python -VV; python -c "import numpy; print('numpy', numpy.__version__)"
          for s in $(seq 1 24); do python studies/C1_5/c15.py one ${{ matrix.arm }} $s out; done
      - uses: actions/upload-artifact@v4
        with:
          name: c15-arm-${{ matrix.arm }}
          path: out/

  analyse:
    needs: [checks, arm]
    if: always() && needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - uses: actions/download-artifact@v4
        with:
          pattern: c15-arm-*
          merge-multiple: true
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: c15-checks
          path: studies/C1_5/
      - run: python studies/C1_5/analyse_c15.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c15-results
          path: out/
