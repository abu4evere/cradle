name: c2e-run

# C2-E: every child of every arm and practice level (studies/C2E/questions.md), on GitHub's machines. Nothing runs
# on the creator's PC.
#   1. checks:  checks_c2e.py; nothing else starts unless All: PASS
#   2. arm:     one job per arm, 2 practice levels x 48 children (seeds 1-48)
#   3. analyse: every child's file plus the analysis, in one artifact, c2e-results
# Run: gh workflow run c2e-run.yml -R abu4evere/cradle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - run: python studies/C2E/checks_c2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2e-checks
          path: studies/C2E/checks.log

  arm:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm: [T, I, Cb, Ct, Ctk, Cyk, Cok, Cp, Cpk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - name: 2 x 48 children
        run: |
          python -VV; python -c "import numpy; print('numpy', numpy.__version__)"
          for p in F S; do for s in $(seq 1 48); do python studies/C2E/c2e.py one ${{ matrix.arm }} $p $s out; done; done
      - uses: actions/upload-artifact@v4
        with:
          name: c2e-arm-${{ matrix.arm }}
          path: out/

  analyse:
    needs: [checks, arm]
    if: always() && needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy==2.2.6"
      - uses: actions/download-artifact@v4
        with:
          pattern: c2e-arm-*
          merge-multiple: true
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: c2e-checks
          path: studies/C2E/
      - run: python studies/C2E/analyse_c2e.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2e-results
          path: out/
